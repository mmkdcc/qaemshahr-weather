<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>آب و هوا | پیش‌بینی ۷ روزه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,Vazirmatn,sans-serif;background:#080c18;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
.hero{padding:28px 20px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 60%);animation:pulse 4s ease-in-out infinite}
.hero-loc{font-size:.75rem;color:rgba(255,255,255,.75);letter-spacing:1px;margin-bottom:6px;position:relative;font-weight:600}
.hero-icon{font-size:4.2rem;line-height:1;margin:6px 0;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));position:relative}
.hero-temp{font-size:4.8rem;font-weight:900;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.3);line-height:1;margin:4px 0;position:relative}
.hero-temp sup{font-size:1.8rem;font-weight:700}
.hero-desc{font-size:1.05rem;color:rgba(255,255,255,.85);font-weight:600;margin-bottom:14px;position:relative}
.hero-details{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;position:relative}
.hd{display:flex;flex-direction:column;align-items:center;gap:2px}
.hd-l{font-size:.6rem;color:rgba(255,255,255,.5)}
.hd-v{font-size:.85rem;font-weight:700;color:#fff}
.chart-section,.pop-section{padding:16px 14px 0}
.chart-section h3,.pop-section h3{font-size:.8rem;color:#64748b;margin-bottom:8px;font-weight:600}
.chart-box,.pop-box{background:#111827;border-radius:16px;padding:14px 8px 8px;border:1px solid rgba(255,255,255,.05)}
.pop-box{padding:14px}
.days-container{padding:16px 10px;display:flex;flex-direction:column;gap:10px}
.day-card{background:#111827;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06);animation:fadeUp .4s ease;transition:transform .2s}
.day-card:active{transform:scale(.99)}
details{width:100%}
details[open]{background:#0d1220}
summary{padding:14px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;-webkit-user-select:none;user-select:none}
summary::-webkit-details-marker{display:none}
.d-icon{font-size:1.8rem;flex-shrink:0}
.d-info{flex:1;min-width:0}
.d-title{font-weight:700;font-size:.9rem;color:#f1f5f9}
.d-title small{font-weight:400;color:#64748b;font-size:.7rem}
.d-desc{font-size:.7rem;color:#94a3b8;margin-top:1px}
.d-stats{text-align:left;flex-shrink:0}
.d-trange{display:flex;align-items:center;gap:6px}
.t-hi{font-size:.95rem;font-weight:800;color:#fbbf24}
.t-lo{font-size:.85rem;font-weight:600;color:#64748b}
.t-sep{color:#475569;font-size:.8rem}
.d-meta{display:flex;gap:6px;margin-top:3px;justify-content:flex-end}
.d-meta span{font-size:.6rem;color:#60a5fa;background:rgba(96,165,250,.1);padding:1px 5px;border-radius:4px}
.tag-today{background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-size:.55rem;padding:2px 7px;border-radius:5px;font-weight:700;margin-right:5px;vertical-align:middle}
.tag-sub{background:#1e293b;color:#94a3b8;font-size:.55rem;padding:2px 7px;border-radius:5px;font-weight:600;margin-right:5px;vertical-align:middle;border:1px solid rgba(255,255,255,.08)}
.d-arrow{font-size:1.3rem;color:#475569;transition:transform .3s;flex-shrink:0;font-weight:300}
details[open] .d-arrow{transform:rotate(90deg);color:#38bdf8}
.h-panel{padding:0 14px 14px;border-top:1px solid rgba(255,255,255,.06)}
.p-sec{margin-top:14px}
.p-title{font-size:.7rem;color:#64748b;font-weight:600;margin-bottom:8px}
.mini-chart{display:flex;gap:1px;height:65px;align-items:flex-end;padding:0 4px}
.htbl{width:100%;min-width:520px;border-collapse:collapse;font-size:.75rem}
.htbl th{padding:7px 5px;color:#475569;font-weight:600;font-size:.6rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
.htbl td{padding:8px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04)}
.tc-time{font-weight:700;color:#e2e8f0;direction:ltr}
.tc-lbl{display:block;font-size:.55rem;color:#475569;font-weight:400;margin-top:1px}
.tc-desc{color:#94a3b8}
.tc-temp{font-weight:800;color:#fbbf24;font-size:.85rem}
.tc-feels{color:#94a3b8}
.tc-humid{color:#60a5fa}
.tc-pop{color:#a78bfa}
.tc-wind{color:#34d399}
.day-row{background:rgba(255,255,255,.02)}
.night-row{background:rgba(15,23,42,.5)}
.summary-box{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.08));border-radius:12px;padding:14px;margin-top:12px;border:1px solid rgba(99,102,241,.15)}
.summary-text{font-size:.8rem;color:#e2e8f0;line-height:1.8;direction:rtl}
.hint-bar{text-align:center;padding:10px;color:#475569;font-size:.7rem}
.footer{text-align:center;padding:20px 14px 36px;color:#334155;font-size:.65rem}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{height:3px}
.scroll-x::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.hero-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.refresh-wrap{text-align:center}
.search-link{display:inline-block;color:rgba(255,255,255,.88);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:9px 20px;border-radius:26px;text-decoration:none;font-size:.78rem;font-weight:600;backdrop-filter:blur(6px);transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s;will-change:transform}
.search-link:hover{background:rgba(255,255,255,.2)}
.home-link{display:inline-block;color:#fcd34d;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.32);padding:9px 20px;border-radius:26px;text-decoration:none;font-size:.78rem;font-weight:600;backdrop-filter:blur(6px);transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s;will-change:transform}
.home-link:hover{background:rgba(251,191,36,.2)}
.search-link:hover,.home-link:hover{transform:translateY(-2px)}
.refresh-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;color:#a5b4fc;background:rgba(99,102,241,.14);border:1px solid rgba(99,102,241,.32);padding:8px 20px;border-radius:26px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;backdrop-filter:blur(6px);transition:transform .25s cubic-bezier(.22,1,.36,1),background .2s;will-change:transform;-webkit-user-select:none;user-select:none}
.refresh-btn:hover{background:rgba(99,102,241,.24);transform:translateY(-2px)}
.refresh-btn:active{transform:scale(.96)}
.refresh-btn:disabled{opacity:.75;cursor:wait;transform:none}
.btn-spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(165,180,252,.3);border-top-color:#a5b4fc;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes flashUp{0%{opacity:.35}100%{opacity:1}}
.refreshing-flash{animation:flashUp .5s ease}
@keyframes updPop{0%{color:#4ade80;transform:scale(1.15)}100%{color:#94a3b8;transform:scale(1)}}
#updTime{display:inline-block}
.loader{max-width:420px;margin:80px auto;text-align:center;color:#64748b;font-size:.85rem;line-height:2}
.spin{display:inline-block;width:26px;height:26px;border:3px solid #1e293b;border-top-color:#fbbf24;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;display:block;margin-inline:auto}
.err{max-width:420px;margin:80px auto;text-align:center;color:#f87171;font-size:.85rem;line-height:2}
.err a{color:#818cf8}
</style>
</head>
<body>
<div id="app"><div class="loader"><span class="spin"></span>در حال دریافت اطلاعات آب و هوا…</div></div>
<script>
/* ===== config ===== */
const DEFAULT={n:"قائمشهر، مازندران",lat:36.4631,lon:52.8604};
const p=new URLSearchParams(location.search);
const CITY={
 n:p.get('name')||DEFAULT.n,
 lat:parseFloat(p.get('lat'))||DEFAULT.lat,
 lon:parseFloat(p.get('lon'))||DEFAULT.lon,
};
document.title=(CITY.n.split('،')[0])+" | آب و هوا";

const WMO={
 0:["آفتابی","☀️","linear-gradient(160deg,#7c5a1e,#5c4218)"],
 1:["غالباً آفتابی","🌤️","linear-gradient(160deg,#6e5527,#5c4218)"],
 2:["نیمه ابری","⛅","linear-gradient(160deg,#3d4a5c,#2c3646)"],
 3:["ابری","☁️","linear-gradient(160deg,#3b4049,#272c34)"],
 45:["مه‌آلود","🌫️","linear-gradient(160deg,#454c58,#333944)"],
 48:["مه یخ‌زده","🌫️","linear-gradient(160deg,#454c58,#333944)"],
 51:["باران خفیف","🌦️","linear-gradient(160deg,#1e3a6e,#16294e)"],
 53:["باران متوسط","🌧️","linear-gradient(160deg,#17306b,#122351)"],
 55:["باران شدید","🌧️","linear-gradient(160deg,#132a66,#0d1d4d)"],
 61:["باران سبک","🌧️","linear-gradient(160deg,#1e3a6e,#16294e)"],
 63:["باران متوسط","🌧️","linear-gradient(160deg,#17306b,#122351)"],
 65:["باران شدید","🌧️","linear-gradient(160deg,#132a66,#101f56)"],
 66:["باران یخ‌زده","🌧️","linear-gradient(160deg,#333c49,#232a35)"],
 67:["باران یخ‌زده شدید","🌧️","linear-gradient(160deg,#2b3442,#1a212c)"],
 71:["برف سبک","🌨️","linear-gradient(160deg,#4a5568,#374151)"],
 73:["برف متوسط","🌨️","linear-gradient(160deg,#4f5a6b,#3e4859)"],
 75:["برف سنگین","❄️","linear-gradient(160deg,#57627a,#46516a)"],
 77:["دانه برف","🌨️","linear-gradient(160deg,#4a5568,#374151)"],
 80:["رگبار خفیف","🌦️","linear-gradient(160deg,#233a75,#2d3a70)"],
 81:["رگبار متوسط","🌧️","linear-gradient(160deg,#17306b,#122351)"],
 82:["رگبار شدید","⛈️","linear-gradient(160deg,#3b2570,#2b1a54)"],
 85:["بارش برف","🌨️","linear-gradient(160deg,#4a5568,#374151)"],
 86:["بارش برف سنگین","❄️","linear-gradient(160deg,#4f5a6b,#3e4859)"],
 95:["رعد و برق","⛈️","linear-gradient(160deg,#38246b,#241543)"],
 96:["رعد و برق با تگرگ","⛈️","linear-gradient(160deg,#33205f,#221340)"],
 99:["رعد و برق شدید با تگرگ","⛈️","linear-gradient(160deg,#2d1a52,#190d31)"],
};
const DNAMES={"Saturday":"شنبه","Sunday":"یکشنبه","Monday":"دوشنبه","Tuesday":"سه‌شنبه","Wednesday":"چهارشنبه","Thursday":"پنجشنبه","Friday":"جمعه"};
const MNAMES=["ژانویه","فوریه","مارس","آوریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"];
const PD='۰۱۲۳۴۵۶۷۸۹';
const pn=s=>String(s).replace(/[0-9]/g,d=>PD[d]);
const wmo=c=>WMO[c]||["نامشخص","❓","linear-gradient(160deg,#262d38,#181d26)"];
const uvE=t=>t>=35?"🔥":t>=28?"☀️":t>=20?"🌤️":t>=12?"🍂":"❄️";
function hlabel(h){
 if(h===0)return "۱۲ بامداد";
 if(h<12)return pn(h)+" صبح";
 if(h===12)return "۱۲ ظهر";
 if(h<17)return pn(h-12)+" بعدازظهر";
 if(h<21)return pn(h-12)+" عصر";
 return pn(h-12)+" شب";
}

async function main(silent){
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${CITY.lat}&longitude=${CITY.lon}`
  +"&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weathercode,windspeed_10m,pressure_msl"
  +"&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,precipitation,weathercode,windspeed_10m"
  +"&timezone=Asia%2FTehran&forecast_days=7&models=ecmwf_ifs025";
 let data;
 if(!silent)document.getElementById('app').innerHTML='<div class="loader"><span class="spin"></span>در حال دریافت اطلاعات آب و هوا…</div>';
 try{
   const r=await fetch(url,{cache:'no-store'});
   if(!r.ok)throw 0;
   data=await r.json();
 }catch(e){
   if(!silent)document.getElementById('app').innerHTML='<div class="err">⚠️ خطا در دریافت داده‌ها<br><a href="index.html">بازگشت به خانه</a></div>';
   return;
 }
 render(data);
}

function render(data){
const cur=data.current,hrl=data.hourly;
const days={};
hrl.time.forEach((t,i)=>{const d=t.slice(0,10);(days[d]=days[d]||[]).push(i)});
const [cdesc,cicon,cgrad]=wmo(cur.weathercode);
const hero=`<div class="hero" style="background:${cgrad}">
<div class="hero-loc">📍 ${esc(CITY.n)}</div>
<div class="hero-icon">${cicon}</div>
<div class="hero-temp">${pn(Math.round(cur.temperature_2m))}<sup>°C</sup></div>
<div class="hero-desc">${cdesc} — احساس ${pn(Math.round(cur.apparent_temperature))}°</div>
<div class="hero-details">
<div class="hd"><span class="hd-l">💧 رطوبت</span><span class="hd-v">${pn(Math.round(cur.relative_humidity_2m))}%</span></div>
<div class="hd"><span class="hd-l">🌬️ باد</span><span class="hd-v">${pn(Math.round(cur.windspeed_10m))} km/h</span></div>
<div class="hd"><span class="hd-l">🌡️ فشار</span><span class="hd-v">${pn(Math.round(cur.pressure_msl||0))} hPa</span></div>
<div class="hd"><span class="hd-l">${uvE(cur.temperature_2m)} احساس</span><span class="hd-v">${pn(Math.round(cur.apparent_temperature))}°</span></div>
</div>
<div class="hero-btns"><a class="search-link" href="city.html">🔎 جستجوی شهر دیگر</a><a class="home-link" href="index.html">🏠 صفحه اصلی</a></div><div class="refresh-wrap"><button class="refresh-btn" id="refreshBtn">🔄 بروزرسانی</button></div>`;

// ---- 24h temp chart ----
const temps24=hrl.temperature_2m.slice(0,24);
const hours24=hrl.time.slice(0,24).map(t=>+t.slice(11,13));
const CW=560,CH=150,PL=30,PR=10,PT=25,PB=28;
const pw=CW-PL-PR,ph=CH-PT-PB;
const tmin=Math.min(...temps24)-2,tmax=Math.max(...temps24)+2,tr=tmax-tmin||1;
const tx=i=>PL+(i/Math.max(temps24.length-1,1))*pw;
const ty=v=>PT+ph-((v-tmin)/tr)*ph;
const pts=temps24.map((t,i)=>`${tx(i).toFixed(1)},${ty(t).toFixed(1)}`).join(" ");
let gridlines="",ylabels="",xlabels="",dots="";
for(let i=0;i<5;i++){
 const v=tmin+tr*i/4,y=ty(v);
 gridlines+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${CW-PR}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="4,4"/>`;
 ylabels+=`<text x="${PL-5}" y="${(y+4).toFixed(1)}" fill="#64748b" font-size="9" text-anchor="end" font-family="monospace">${Math.round(v)}°</text>`;
}
temps24.forEach((t,i)=>{
 dots+=`<circle cx="${tx(i).toFixed(1)}" cy="${ty(t).toFixed(1)}" r="2.5" fill="#fbbf24" stroke="#0f172a" stroke-width="1.5"/>`;
 if(i%4===0)xlabels+=`<text x="${tx(i).toFixed(1)}" y="${CH-6}" fill="#475569" font-size="8" text-anchor="middle" font-family="monospace">${String(hours24[i]).padStart(2,'0')}:00</text>`;
 if(i%3===0)dots+=`<text x="${tx(i).toFixed(1)}" y="${(ty(t)-8).toFixed(1)}" fill="#fbbf24" font-size="8" text-anchor="middle" font-weight="600">${Math.round(t)}°</text>`;
});
const area=`${tx(0).toFixed(1)},${PT+ph} `+pts+` ${tx(temps24.length-1).toFixed(1)},${PT+ph}`;
const chart=`<div class="chart-section"><h3>📈 نمودار دمای ۲۴ ساعت آینده</h3>
<div class="chart-box scroll-x"><svg viewBox="0 0 ${CW} ${CH}" style="width:100%;height:auto;display:block;">
<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/><stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
${gridlines}${ylabels}
<polygon points="${area}" fill="url(#tg)"/>
<polyline points="${pts}" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>
${dots}${xlabels}
</svg></div></div>`;

// ---- precip bars ----
let pop="";
for(let i=0;i<Math.min(18,hrl.time.length);i++){
 const h=+hrl.time[i].slice(11,13);
 const p_=hrl.precipitation_probability?hrl.precipitation_probability[i]??0:0;
 const bc=p_>50?"#3b82f6":p_>20?"#818cf8":"#334155";
 pop+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;"><span style="width:30px;font-size:.65rem;color:#94a3b8;text-align:left;font-family:monospace;">${String(h).padStart(2,'0')}</span><div style="flex:1;height:7px;background:#1e293b;border-radius:4px;overflow:hidden;"><div style="width:${p_}%;height:100%;background:${bc};border-radius:4px;"></div></div><span style="width:28px;font-size:.65rem;color:${bc};text-align:right;font-weight:600;">${p_}%</span></div>`;
}
const popHtml=`<div class="pop-section"><h3>🌧️ احتمال بارش ۱۸ ساعت آینده</h3><div class="pop-box">${pop}</div></div>`;

// ---- day cards ----
const todayStr=hrl.time[0].slice(0,10);
let dhtml="";
Object.entries(days).forEach(([d,indices],idx)=>{
const dow=DNAMES[["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(d+"T00:00:00Z").getUTCDay()]];
 const m=MNAMES[new Date(d+"T00:00:00Z").getUTCMonth()];
 const dayN=new Date(d+"T00:00:00Z").getUTCDate();
 const temps=indices.map(i=>hrl.temperature_2m[i]);
 const mn=Math.min(...temps),mx=Math.max(...temps);
 const mp=Math.max(...indices.map(i=>hrl.precipitation_probability?hrl.precipitation_probability[i]??0:0));
 const ah=indices.reduce((s,i)=>s+hrl.relative_humidity_2m[i],0)/indices.length;
 const [ddesc,dicon]=wmo(hrl.weathercode[indices[Math.floor(indices.length/2)]]);
 const tag=d===todayStr?'<span class="tag-today">امروز</span>':(idx===1?'<span class="tag-sub">فردا</span>':'');
 const vis=d===todayStr?"open":"";

 // mini bars
 let mbar="";
 indices.forEach(i=>{
   const hr=+hrl.time[i].slice(11,13);
   const t=hrl.temperature_2m[i];
   const n=(t-mn)/(mx-mn+0.1);
   const bh=Math.max(n*45,4);
   const bc=(hr>=8&&hr<=18)?"#fbbf24":"#60a5fa";
   mbar+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;"><div style="font-size:.5rem;color:#94a3b8;">${Math.round(t)}</div><div style="width:100%;max-width:10px;height:${bh.toFixed(0)}px;background:${bc};border-radius:2px;"></div><div style="font-size:.45rem;color:#475569;">${hr}</div></div>`;
 });

 // daily summary
 const parts=[];
 parts.push(`🌡️ دما بین ${pn(Math.round(mn))}° تا ${pn(Math.round(mx))}° در نوسانه`);
 const rainH=indices.filter(i=>(hrl.precipitation_probability?hrl.precipitation_probability[i]??0:0)>30);
 if(rainH.length){
   const rs=+hrl.time[rainH[0]].slice(11,13),re=+hrl.time[rainH[rainH.length-1]].slice(11,13);
   parts.push(rs===re?`🌧️ احتمال بارش در ساعت ${pn(rs)}`:`🌧️ احتمال بارش از ساعت ${pn(rs)} تا ${pn(re)}`);
 }else parts.push("☀️ بدون احتمال بارش");
 const windy=indices.filter(i=>hrl.windspeed_10m[i]>20);
 if(windy.length){
   const mw=Math.max(...windy.map(i=>hrl.windspeed_10m[i]));
   parts.push(`🌬️ باد تا ${pn(Math.round(mw))} km/h`);
 }else parts.push("🍃 هوای آرام");
 const good=indices.filter(i=>{
   const hr=+hrl.time[i].slice(11,13);
   return hr>=6&&hr<=19&&(hrl.precipitation_probability?hrl.precipitation_probability[i]??0:0)<20&&hrl.temperature_2m[i]>=18&&hrl.temperature_2m[i]<=28;
 });
 if(good.length){
   const gs=+hrl.time[good[0]].slice(11,13),ge=+hrl.time[good[good.length-1]].slice(11,13);
   parts.push(`✅ بهترین زمان بیرون رفتن: ${pn(gs)} تا ${pn(ge)}`);
 }
 const summary=parts.join(" • ");

 // hourly rows
 let rows="";
 indices.forEach(i=>{
   const dt=hrl.time[i],hr=+dt.slice(11,13);
   const rc=(hr>=6&&hr<=19)?"day-row":"night-row";
   const t=hrl.temperature_2m[i],fl=hrl.apparent_temperature[i];
   const hu=hrl.relative_humidity_2m[i];
   const pp=hrl.precipitation_probability?hrl.precipitation_probability[i]??0:0;
   const wc=hrl.weathercode[i],wi=hrl.windspeed_10m[i];
   const [wd,wi2]=wmo(wc);
   rows+=`<tr class="${rc}"><td class="tc-time">${String(hr).padStart(2,'0')}:00 <span class="tc-lbl">${hlabel(hr)}</span></td><td class="tc-desc">${wi2} ${wd}</td><td class="tc-temp">${pn(Math.round(t))}°</td><td class="tc-feels">${pn(Math.round(fl))}°</td><td class="tc-humid">${pn(Math.round(hu))}%</td><td class="tc-pop">${pn(pp)}%</td><td class="tc-wind">${pn(Math.round(wi))} km/h</td></tr>`;
 });

 dhtml+=`<div class="day-card"><details ${vis}><summary>
<div class="d-icon">${dicon}</div>
<div class="d-info"><div class="d-title">${dow} <small>${pn(dayN)} ${m}</small> ${tag}</div><div class="d-desc">${ddesc}</div></div>
<div class="d-stats"><div class="d-trange"><span class="t-hi">${pn(Math.round(mx))}°</span><span class="t-sep">/</span><span class="t-lo">${pn(Math.round(mn))}°</span></div>
<div class="d-meta">${mp>10?`<span>☔ ${pn(mp)}%</span>`:""}<span>💧 ${pn(Math.round(ah))}%</span></div></div>
<div class="d-arrow">‹</div>
</summary>
<div class="h-panel">
<div class="p-sec"><div class="p-title">📊 دمای ساعتی</div><div class="mini-chart">${mbar}</div></div>
<div class="p-sec"><div class="p-title">📋 جزئیات ساعتی</div><div class="scroll-x"><table class="htbl">
<thead><tr><th>ساعت</th><th>وضعیت</th><th>دما</th><th>احساس</th><th>رطوبت</th><th>بارش</th><th>باد</th></tr></thead>
<tbody>${rows}</tbody></table></div></div>
<div class="p-sec summary-box"><div class="p-title">📝 خلاصه وضعیت ${dow}</div><div class="summary-text">${summary}</div></div>
</div></details></div>`;
});

const now=new Date().toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
document.getElementById('app').innerHTML=
hero+chart+popHtml+
'<div class="hint-bar">👇 روز مورد نظر رو لمس کن تا جزئیات ساعتی باز بشه</div>'+
`<div class="days-container">${dhtml}</div>`+
`<div class="footer">داده‌ها از <a href="https://open-meteo.com" style="color:#475569">Open-Meteo</a> • آخرین بروزرسانی: <b id="updTime" style="color:#94a3b8">${now}</b></div>`;
document.getElementById('refreshBtn').addEventListener('click',async function(){
  const b=this;
  if(b.disabled)return;
  b.disabled=true;b.classList.add('refreshing');
  b.innerHTML='<span class="btn-spin"></span> در حال بروزرسانی…';
  try{await main(true)}catch(e){}
  b.disabled=false;b.classList.remove('refreshing');
  b.textContent='✓ بروزرسانی شد';
  const t=document.getElementById('updTime');
  if(t){t.textContent=new Date().toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});t.style.animation='none';void t.offsetWidth;t.style.animation='updPop .6s ease';}
  document.getElementById('app').classList.remove('refreshing-flash');void document.getElementById('app').offsetWidth;document.getElementById('app').classList.add('refreshing-flash');
  setTimeout(()=>{b.textContent='🔄 بروزرسانی'},2500);
});
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
main();
</script>
</body>
</html>
