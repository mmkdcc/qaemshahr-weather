.top{max-width:480px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}

}
#q:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.15)}

.hint{max-width:480px;margin:0 auto 16px;font-size:.7rem;color:#475569;text-align:center;line-height:1.7}
.results{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.city{
  display:flex;align-items:center;gap:12px;background:#111827;border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:13px 14px;text-decoration:none;color:#f1f5f9;transition:all .2s ease;
  animation:fadeUp .35s ease both;
}
.city:hover{border-color:rgba(251,191,36,.35);transform:translateY(-2px)}
.c-icon{font-size:1.4rem;flex-shrink:0}
.c-info{flex:1;min-width:0}
.c-name{font-weight:700;font-size:.9rem}
.c-sub{font-size:.68rem;color:#64748b;margin-top:2px}
.go{font-size:.7rem;color:#818cf8;background:rgba(99,102,241,.12);padding:4px 10px;border-radius:8px;flex-shrink:0;font-weight:600}
.empty{text-align:center;color:#475569;font-size:.8rem;padding:30px 10px;line-height:1.8}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #334155;border-top-color:#818cf8;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-4px}
.quick{max-width:480px;margin:22px auto 0}
.q-title{font-size:.72rem;color:#475569;margin-bottom:10px;font-weight:600}
.q-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{

  padding:6px 13px;border-radius:20px;text-decoration:none;transition:all .2s;
}
.chip:hover{color:#fbbf24;border-color:rgba(251,191,36,.3)}
.footer{max-width:480px;margin:34px auto 0;text-align:center;color:#334155;font-size:.65rem}

const resEl=document.getElementById('res');
const qEl=document.getElementById('q');
const clearBtn=document.getElementById('clear');

// chips
document.getElementById('chips').innerHTML=POPULAR.map(c=>
 `<a class="chip" href="#" data-n="${c.n}" data-lat="${c.lat}" data-lon="${c.lon}">${c.n}</a>`).join('');
document.getElementById('chips').addEventListener('click',e=>{
 const a=e.target.closest('.chip'); if(!a)return;
 e.preventDefault(); goCity(a.dataset.n,+a.dataset.lat,+a.dataset.lon);
});

function goCity(name,lat,lon){
 location.href=`weather.html?name=${encodeURIComponent(name)}&lat=${lat}&lon=${lon}`;
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function normalizeFa(s){
  // یک‌سازی حروف فارسی برای جستجوی بهتر
  return s.replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه").replace(/‌/g," ").replace(/\s+/g," ").trim();
}
function localSearch(q){
  const nq=normalizeFa(q);
  return IRAN_CITIES.filter(c=>{
    const nn=normalizeFa(c.n),np=normalizeFa(c.p);
    return nn.startsWith(nq)||nn.includes(" "+nq)||nq.length>=3&&nn.includes(nq)||np.startsWith(nq)&&q.length>=3;
  }).slice(0,12);
}
async function apiSearch(q){
  try{
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=12&language=fa&format=json`);
    const d=await r.json();
    return (d.results||[]).map(c=>({
      name:c.name,lat:c.latitude,lon:c.longitude,
      sub:[c.admin1,c.country].filter(Boolean).join("، "),
      ir:c.country_code==="IR"
    }));
  }catch(e){return[]}
}
async function search(q){
  if(ctrl)ctrl.abort();
  ctrl=new AbortController();
  resEl.innerHTML='<div class="empty"><span class="spin"></span><br>در حال جستجو…</div>';
  // ۱) نتیجه محلی فوری
  const local=localSearch(q);
  if(local.length){
    renderResults(local.map(c=>({name:c.n,sub:c.p+"، ایران",lat:c.lat,lon:c.lon,ir:true})),q,true);
  }
  // ۲) بعد API برای تکمیل (شهرهای خارجی و موارد غیرواقع)
  const api=await apiSearch(q);
  if(api.length){
    // ادغام بدون تکرار (بر اساس نام+استان)
    const seen=new Set(local.map(c=>normalizeFa(c.n)));
    const merged=[...local.map(c=>({name:c.n,sub:c.p+"، ایران",lat:c.lat,lon:c.lon,ir:true})),
      ...api.filter(a=>!seen.has(normalizeFa(a.name)))];
    renderResults(merged,q,false);
  }else if(!local.length){
    resEl.innerHTML=`<div class="empty">😕 شهری با نام «${esc(q)}» پیدا نشد<br>املای دیگه‌ای رو امتحان کن</div>`;
  }
}
function renderResults(list,q,instant){
  if(!list.length){
    resEl.innerHTML=`<div class="empty">😕 شهری با نام «${esc(q)}» پیدا نشد<br>املای دیگه‌ای رو امتحان کن</div>`;
    return;
  }
  resEl.innerHTML=list.map((c,i)=>{
    return `<a class="city" style="animation-delay:${i*40}ms" href="#" data-lat="${c.lat}" data-lon="${c.lon}" data-n="${esc(c.name)}">
      <span class="c-icon">${c.ir?'🇮🇷':'🌍'}</span>
      <span class="c-info"><span class="c-name">${esc(c.name)}</span><span class="c-sub" style="display:block">${esc(c.sub)}</span></span>
      <span class="go">مشاهده ›</span></a>`;
  }).join('');
}

resEl.addEventListener('click',e=>{
 const a=e.target.closest('.city'); if(!a)return;
 e.preventDefault(); goCity(a.dataset.n,+a.dataset.lat,+a.dataset.lon);
});

qEl.addEventListener('input',()=>{
 const v=qEl.value.trim();
 clearBtn.style.display=v?'block':'none';
 document.getElementById('quickBox').style.display=v?'none':'block';
 clearTimeout(timer);
 if(v.length<2){ if(!v) resEl.innerHTML=''; else resEl.innerHTML=''; return; }
 timer=setTimeout(()=>{lastQ=v;search(v)},400);
});
qEl.addEventListener("focus",()=>{setTimeout(()=>{qEl.scrollIntoView({block:"center",behavior:"smooth"})},300)});
clearBtn.addEventListener('click',()=>{
 qEl.value='';clearBtn.style.display='none';
 resEl.innerHTML='';document.getElementById('quickBox').style.display='block';qEl.focus();
});
</script>
</body>
</html>
