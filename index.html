<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="پیش‌بینی آب و هوا — قائمشهر و همه شهرهای ایران و جهان">
<link rel="manifest" href="manifest.json">
<title>آب و هوا | پیش‌بینی آب و هوا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes glowP{0%,100%{box-shadow:0 8px 32px rgba(99,102,241,.25)}50%{box-shadow:0 12px 44px rgba(99,102,241,.45)}}
@keyframes glowW{0%,100%{box-shadow:0 8px 32px rgba(245,158,11,.22)}50%{box-shadow:0 12px 44px rgba(245,158,11,.42)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Vazirmatn',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0e1a;
  color:#f1f5f9;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 20px;
  overflow-x:hidden;
}

/* Ambient background */
.bg-particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.bg-particles::before,.bg-particles::after{
  content:'';
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:.14;
  will-change:transform;
}
.bg-particles::before{
  width:min(420px,90vw);height:min(420px,90vw);
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  top:-120px;left:-120px;
  animation:pulse 9s ease-in-out infinite;
}
.bg-particles::after{
  width:min(360px,80vw);height:min(360px,80vw);
  background:linear-gradient(135deg,#f59e0b,#f97316);
  bottom:-110px;right:-110px;
  animation:pulse 9s ease-in-out infinite 4.5s;
}

.container{
  position:relative;
  z-index:1;
  width:100%;
  max-width:430px;
  text-align:center;
}

/* Logo & Title */
.logo{
  font-size:3rem;
  margin-bottom:10px;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.35));
  animation:float 6s ease-in-out infinite;
  will-change:transform;
}
.title{
  font-size:1.9rem;
  font-weight:900;
  background:linear-gradient(135deg,#f8fafc,#94a3b8);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:8px;
  letter-spacing:-.5px;
}
.subtitle{
  font-size:.85rem;
  color:#64748b;
  margin-bottom:36px;
  line-height:1.7;
}

/* Cards */
.cards{display:flex;flex-direction:column;gap:16px;width:100%}

.card{
  position:relative;
  display:block;
  border-radius:22px;
  padding:26px 24px;
  text-decoration:none;
  color:#fff;
  overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease;
  animation:fadeUp .7s cubic-bezier(.22,1,.36,1) both;
  outline:none;
}
.card:nth-child(1){animation-delay:.08s}
.card:nth-child(2){animation-delay:.2s}
.card:focus-visible{outline:2px solid #fbbf24;outline-offset:3px}
.card:active{transform:scale(.98)}

.card::before{
  content:'';
  position:absolute;
  inset:0;
  opacity:.13;
  z-index:0;
}
.card::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09),transparent 45%);
  opacity:0;
  transition:opacity .4s ease;
  z-index:0;
}
.card:hover::after,.card:focus-visible::after{opacity:1}

.card-market{
  background:linear-gradient(140deg,#1e1b4b,#312e81);
  border:1px solid rgba(129,140,248,.28);
  box-shadow:0 8px 32px rgba(99,102,241,.18);
}
.card-market::before{background:linear-gradient(135deg,#6366f1,#4f46e5)}
.card-market:hover{transform:translateY(-5px);animation:glowP 2.4s ease-in-out infinite}

.card-weather{
  background:linear-gradient(140deg,#1c1917,#292524);
  border:1px solid rgba(251,191,36,.28);
  box-shadow:0 8px 32px rgba(245,158,11,.15);
}
.card-weather::before{background:linear-gradient(135deg,#f59e0b,#d97706)}
.card-weather:hover{transform:translateY(-5px);animation:glowW 2.4s ease-in-out infinite}

.card-content{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:16px;
}
.card-icon{
  font-size:2.6rem;
  flex-shrink:0;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.35));
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.card:hover .card-icon{transform:scale(1.12) rotate(-4deg)}
.card-info{flex:1;text-align:right;min-width:0}
.card-title{
  font-size:1.12rem;
  font-weight:800;
  margin-bottom:4px;
}
.card-desc{
  font-size:.74rem;
  color:rgba(255,255,255,.58);
  line-height:1.6;
}
.card-arrow{
  font-size:1.5rem;
  color:rgba(255,255,255,.38);
  flex-shrink:0;
  transition:transform .3s ease,color .3s ease;
}
.card:hover .card-arrow,.card:focus-visible .card-arrow{
  transform:translateX(-6px);
  color:rgba(255,255,255,.85);
}

/* Features */
.card-features{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:14px;
  position:relative;
  z-index:1;
}
.card-feat{
  font-size:.66rem;
  font-weight:500;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.06);
  padding:4px 11px;
  border-radius:12px;
  color:rgba(255,255,255,.72);
  backdrop-filter:blur(4px);
}

/* Footer */
.footer{
  margin-top:38px;
  text-align:center;
  color:#334155;
  font-size:.68rem;
  position:relative;
  z-index:1;
  line-height:1.9;
}
.live-dot{
  display:inline-block;
  width:6px;height:6px;
  background:#22c55e;
  border-radius:50%;
  margin-left:4px;
  box-shadow:0 0 8px rgba(34,197,94,.8);
  animation:pulse 2s ease-in-out infinite;
}
</style>
</head>
<body>

<div class="bg-particles"></div>

<div class="container">
  <div class="logo">🌤️</div>
  <div class="title">آب و هوا</div>
  <div class="subtitle">پیش‌بینی آب و هوا</div>

  <div class="cards">
    <!-- Weather Card -->
    <a href="weather.html" class="card card-weather">
      <div class="card-content">
        <div class="card-icon">🌤️</div>
        <div class="card-info">
          <div class="card-title">قائمشهر</div>
          <div class="card-desc">پیش‌بینی ۷ روزه با جزئیات ساعتی و نمودار</div>
        </div>
        <div class="card-arrow">‹</div>
      </div>
      <div class="card-features">
        <span class="card-feat">🌡️ ۷ روز آینده</span>
        <span class="card-feat">📊 نمودار دما</span>
        <span class="card-feat">🌧️ احتمال بارش</span>
        <span class="card-feat">📝 گزارش روزانه</span>
      </div>
    </a>

    <!-- City Search Card -->
    <a href="city.html" class="card card-market">
      <div class="card-content">
        <div class="card-icon">🔎</div>
        <div class="card-info">
          <div class="card-title">جستجوی شهرها</div>
          <div class="card-desc">آب و هوای هر شهری از ایران و سراسر جهان</div>
        </div>
        <div class="card-arrow">‹</div>
      </div>
      <div class="card-features">
        <span class="card-feat">🌍 همه شهرهای جهان</span>
        <span class="card-feat">⚡ جستجوی فوری</span>
        <span class="card-feat">⭐ شهرهای پرطرفدار</span>
      </div>
    </a>
  </div>

  <div class="footer">
    <span class="live-dot"></span> داده‌ها از Open-Meteo • بروزرسانی لحظه‌ای
  </div>
</div>

<script>
/* Pointer-follow glow on cards (subtle, GPU-friendly) */
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('pointermove',e=>{
    const r=card.getBoundingClientRect();
    card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
    card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
  },{passive:true});
});
</script>

</body>
</html>
