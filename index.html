<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.json">
<title>آب و هوای قائمشهر | پیش‌بینی ۷ روزه</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,0.3)}50%{box-shadow:0 0 40px rgba(99,102,241,0.6)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0e1a;
  color:#f1f5f9;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  overflow-x:hidden;
}

/* Background particles */
.bg-particles{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.bg-particles::before,.bg-particles::after{
  content:'';
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.15;
}
.bg-particles::before{
  width:400px;height:400px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  top:-100px;left:-100px;
  animation:pulse 8s ease-in-out infinite;
}
.bg-particles::after{
  width:350px;height:350px;
  background:linear-gradient(135deg,#f59e0b,#f97316);
  bottom:-100px;right:-100px;
  animation:pulse 8s ease-in-out infinite 4s;
}

.container{
  position:relative;
  z-index:1;
  width:100%;
  max-width:420px;
  text-align:center;
}

/* Logo & Title */
.logo{
  font-size:3rem;
  margin-bottom:8px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));
}
.title{
  font-size:1.8rem;
  font-weight:900;
  background:linear-gradient(135deg,#f1f5f9,#94a3b8);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.subtitle{
  font-size:0.85rem;
  color:#64748b;
  margin-bottom:40px;
  line-height:1.6;
}
.location-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(99,102,241,0.1);
  border:1px solid rgba(99,102,241,0.2);
  padding:6px 14px;
  border-radius:20px;
  font-size:0.75rem;
  color:#818cf8;
  margin-bottom:32px;
}

/* Cards */
.cards{display:flex;flex-direction:column;gap:16px;width:100%}

.card{
  position:relative;
  border-radius:20px;
  padding:28px 24px;
  text-decoration:none;
  color:#fff;
  overflow:hidden;
  transition:all .3s ease;
  animation:fadeUp .6s ease both;
}
.card:nth-child(1){animation-delay:.1s}
.card:nth-child(2){animation-delay:.25s}

.card::before{
  content:'';
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  opacity:0.15;
  z-index:0;
}
.card::after{
  content:'';
  position:absolute;
  top:-50%;left:-50%;
  width:200%;height:200%;
  background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 60%);
  z-index:0;
}

.card-market{
  background:linear-gradient(135deg,#1e1b4b,#312e81);
  border:1px solid rgba(129,140,248,0.3);
}
.card-market::before{
  background:linear-gradient(135deg,#6366f1,#4f46e5);
}
.card-market:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 40px rgba(99,102,241,0.4);
  animation:glow 2s ease-in-out infinite;
}

.card-weather{
  background:linear-gradient(135deg,#1c1917,#292524);
  border:1px solid rgba(251,191,36,0.3);
}
.card-weather::before{
  background:linear-gradient(135deg,#f59e0b,#d97706);
}
.card-weather:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 40px rgba(245,158,11,0.4);
}

.card-content{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  gap:16px;
}
.card-icon{
  font-size:2.8rem;
  flex-shrink:0;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.3));
}
.card-info{flex:1;text-align:right}
.card-title{
  font-size:1.15rem;
  font-weight:800;
  margin-bottom:4px;
}
.card-desc{
  font-size:0.75rem;
  color:rgba(255,255,255,0.6);
  line-height:1.5;
}
.card-arrow{
  font-size:1.5rem;
  color:rgba(255,255,255,0.4);
  flex-shrink:0;
  transition:transform .3s ease;
}
.card:hover .card-arrow{
  transform:translateX(-8px);
  color:rgba(255,255,255,0.8);
}

/* Features list */
.card-features{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
  position:relative;
  z-index:1;
}
.card-feat{
  font-size:0.65rem;
  background:rgba(255,255,255,0.1);
  padding:3px 10px;
  border-radius:10px;
  color:rgba(255,255,255,0.7);
}

/* Footer */
.footer{
  margin-top:40px;
  text-align:center;
  color:#334155;
  font-size:0.7rem;
  position:relative;
  z-index:1;
}
.footer a{color:#475569;text-decoration:none}

/* Live indicator */
.live-dot{
  display:inline-block;
  width:6px;height:6px;
  background:#22c55e;
  border-radius:50%;
  margin-right:4px;
  animation:pulse 2s ease-in-out infinite;
}
</style>
</head>
<body>

<div class="bg-particles"></div>

<div class="container">
  <div class="logo">🌤️</div>
  <div class="title">آب و هوای قائمشهر</div>
  <div class="subtitle">پیش‌بینی دقیق ۷ روزه با جزئیات ساعتی</div>
  <div class="location-badge">
    <span class="live-dot"></span>
    قائمشهر، مازندران
  </div>

  <div class="cards">
    <!-- Weather Card -->
    <a href="weather.html" class="card card-weather">
      <div class="card-content">
        <div class="card-icon">🌤️</div>
        <div class="card-info">
          <div class="card-title">آب و هوای قائمشهر</div>
          <div class="card-desc">پیش‌بینی ۷ روزه با جزئیات ساعتی و نمودار</div>
        </div>
        <div class="card-arrow">‹</div>
      </div>
      <div class="card-features">
        <span class="card-feat">🌡️ ۷ روز آینده</span>
        <span class="card-feat">📊 نمودار دما</span>
        <span class="card-feat">🌧️ احتمال بارش</span>
        <span class="card-feat">📝 گزارش روزانه</span>
      </div>
    </a>
  </div>

  <div class="footer">
    <span class="live-dot"></span> بروزرسانی خودکار هر ۱ ساعت<br>
    ساخته شده با ❤️ توسط <a href="https://t.me/MrKillerBot">Hermes</a>
  </div>
</div>

</body>
</html>
